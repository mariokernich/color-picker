appId: de.kernich.colorpicker
productName: ChipDeck
copyright: Copyright © 2026 Mario Kernich
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - resources/**
  - '!**/*.map'
asarUnpack:
  - resources/**
# Live screen sampler, built for each packaged architecture by the beforePack hook.
beforePack: ./scripts/build-native.mjs
extraResources:
  - from: native/sampler/prebuilds/${platform}-${arch}
    to: native
    filter: [sampler.node]

mac:
  category: public.app-category.graphics-design
  minimumSystemVersion: '13.0'
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    # Menu bar app: no Dock icon.
    LSUIElement: true
  notarize: false

mas:
  type: distribution
  hardenedRuntime: false
  entitlements: build/entitlements.mas.plist
  entitlementsInherit: build/entitlements.mas.inherit.plist
  # Download from the Apple Developer portal; not committed.
  provisioningProfile: build/embedded.provisionprofile

masDev:
  type: development
  entitlements: build/entitlements.mas.plist
  entitlementsInherit: build/entitlements.mas.inherit.plist
  provisioningProfile: build/development.provisionprofile

dmg:
  artifactName: ${productName}-${version}.${ext}

win:
  target:
    - target: nsis
      arch: [x64, arm64]
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: true
  perMachine: false
  shortcutName: ChipDeck

appx:
  # Values from Partner Center > Product identity (Store ID 9N8VGKW7M18P). The display name must
  # be the name reserved in Partner Center.
  identityName: MarioKernich.ChipDeckColorPicker
  publisher: CN=5F9A62F5-C953-4CA0-A263-EDA7D3419B3C
  publisherDisplayName: Mario Kernich
  displayName: 'ChipDeck: Color Picker'
  applicationId: ColorPicker
  backgroundColor: transparent
  showNameOnTiles: false
  languages: [en-US, de-DE]
