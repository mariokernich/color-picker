name: Release

# Builds macOS and Windows packages for every push to main and attaches them to a
# draft release. Drafts are only visible to collaborators with write access, so the
# paid app is not distributed for free even though the repository is public.

on:
  push:
    branches: [main]
    paths-ignore: ['site/**', 'docs/**', '**/*.md', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: mac
            # Unsigned universal DMG/ZIP for testing; store builds need certificates (docs/STORE.md).
            targets: --mac dmg zip
          - os: windows-latest
            name: windows
            targets: --win nsis appx
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package
        shell: bash
        run: >
          npx electron-builder ${{ matrix.targets }} --publish never
          -c.buildVersion=${{ github.run_number }}
          -c.appx.setBuildNumber=true
        env:
          BUILD_NUMBER: ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.appx

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "tag=v$(node -p "require('./package.json').version")-build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.tag }}
          draft: true
          generate_release_notes: true
          files: artifacts/*
