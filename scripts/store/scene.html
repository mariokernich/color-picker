<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1440px;
        height: 900px;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        background: #f6f4ff;
        color: #1d1b2f;
      }
      .nav {
        height: 72px;
        display: flex;
        align-items: center;
        padding: 0 64px;
        gap: 36px;
        font-weight: 600;
        font-size: 17px;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 20px;
        font-weight: 800;
        margin-right: auto;
      }
      .dot {
        width: 28px;
        height: 28px;
        border-radius: 9px;
        background: conic-gradient(#ff5f6d, #ffc371, #3bceac, #4361ee, #b5179e, #ff5f6d);
      }
      .btn {
        background: #1d1b2f;
        color: #fff;
        padding: 12px 22px;
        border-radius: 12px;
      }
      .hero {
        display: grid;
        grid-template-columns: 1.05fr 1fr;
        gap: 48px;
        padding: 48px 64px 0;
      }
      h1 {
        font-size: 68px;
        line-height: 1.02;
        letter-spacing: -2px;
        font-weight: 850;
      }
      h1 span {
        background: linear-gradient(90deg, #f72585, #7209b7 45%, #4361ee);
        -webkit-background-clip: text;
        color: transparent;
      }
      p {
        font-size: 20px;
        line-height: 1.5;
        color: #4a4766;
        margin-top: 22px;
        max-width: 560px;
      }
      .cta {
        display: flex;
        gap: 14px;
        margin-top: 30px;
      }
      .cta div {
        padding: 16px 26px;
        border-radius: 14px;
        font-weight: 700;
        font-size: 17px;
      }
      .a {
        background: linear-gradient(135deg, #ff5f6d, #ffc371);
        color: #fff;
      }
      .b {
        background: #fff;
        border: 2px solid #e2def5;
      }
      .art {
        position: relative;
        height: 640px;
      }
      .card {
        position: absolute;
        border-radius: 28px;
        box-shadow: 0 30px 60px rgba(40, 20, 90, 0.18);
      }
      .c1 {
        inset: 0 60px 160px 0;
        background:
          radial-gradient(circle at 25% 30%, #ffd23f 0 14%, transparent 15%),
          radial-gradient(circle at 70% 65%, #3bceac 0 22%, transparent 23%),
          linear-gradient(135deg, #7209b7, #f72585 55%, #ff9e00);
      }
      .c2 {
        width: 300px;
        height: 200px;
        right: 0;
        bottom: 40px;
        background: #fff;
        padding: 22px;
      }
      .sw {
        display: flex;
        gap: 10px;
        margin-top: 14px;
      }
      .sw i {
        flex: 1;
        height: 96px;
        border-radius: 14px;
      }
      .c3 {
        width: 220px;
        height: 220px;
        left: -30px;
        bottom: 0;
        background: linear-gradient(160deg, #4cc9f0, #4361ee 60%, #3a0ca3);
      }
      .row {
        display: flex;
        gap: 18px;
        padding: 40px 64px;
      }
    </style>
  </head>
  <body>
    <div class="nav">
      <div class="logo">
        <div class="dot"></div>
        Studio Lumen
      </div>
      <div>Work</div>
      <div>Services</div>
      <div>About</div>
      <div class="btn">Contact</div>
    </div>
    <div class="hero">
      <div>
        <h1>Bold brands,<br /><span>vivid colors.</span></h1>
        <p>
          We design identities, websites and products that people remember. Every palette is crafted
          pixel by pixel.
        </p>
        <div class="cta">
          <div class="a">Start a project</div>
          <div class="b">See our work</div>
        </div>
      </div>
      <div class="art">
        <div class="card c1"></div>
        <div class="card c3"></div>
        <div class="card c2">
          <b>Palette · Sunset</b>
          <div class="sw">
            <i style="background: #540d6e"></i><i style="background: #ee4266"></i
            ><i style="background: #ffd23f"></i><i style="background: #3bceac"></i>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
